services:
  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: postgres://flashsale:flashsale@postgres:5432/flashsale?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
      POSTGRES_DB: flashsale
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d flashsale"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
